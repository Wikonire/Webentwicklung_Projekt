<mat-card data-testid="map">

    <mat-card-title>
      @if (route) {
      Start: {{ route.start }}, Ziel: {{ route.destination }}
      } @else {
      Gib ein Start- und Zielort ein um die Route anzuzeigen
    }
    </mat-card-title>
  <mat-card-content>
  <div #mapContainer data-testid="route-polyline" id="map">
  </div>
</mat-card-content>
</mat-card>
