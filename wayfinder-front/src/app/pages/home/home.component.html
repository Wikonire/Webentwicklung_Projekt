<div class="header-row">
  <app-search-form (routeComputed)="handleRouteComputed($event)"></app-search-form>
  <div class="tab-group">
    <mat-tab-group>
      <mat-tab label="Top 10 der letzten Routen"><app-top-routes></app-top-routes></mat-tab>
      <mat-tab label="Gespeicherte Routen"><app-saved-routes></app-saved-routes></mat-tab>
    </mat-tab-group>
  </div>
</div>

<div class="content">
  <app-map
    [geoJsonRouteData]="currentGeoJson()"
    [route]="currentRouteQuery()"></app-map>
</div>
