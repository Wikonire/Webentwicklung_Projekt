<mat-card>
  <mat-card-title>Meine gespeicherten Routen</mat-card-title>
  <mat-list>
    @for (r of routes; track r.id) {
      <mat-list-item>
        <div matListItemTitle>{{ r.name || (r.startLat + ',' + r.startLng) }} → {{ r.endLat }},{{ r.endLng }}</div>
        <div matListItemLine>{{ r.distance ?? '?' }} m • {{ r.duration ?? '?' }} s</div>
        <button mat-icon-button color="warn" (click)="remove(r.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </mat-list-item>
    } @empty {
    <mat-list-item>Keine Routen gespeichert.</mat-list-item>
  }
  </mat-list>
</mat-card>
